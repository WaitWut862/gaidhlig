{{define "items_sentences"}}
{{range .Items}}
<div class="result-item"
    hx-get="/sentence/{{.ID}}"
    hx-target="#view-panel"
    hx-trigger="click"
    hx-swap="innerHTML">
    {{.TextGd}}
</div>
{{end}}
{{if and .Items (ne .NextOffset -1)}}
<div hx-get="/search?type=sentences&query={{.Query}}&exact={{.Exact}}&offset={{.NextOffset}}"
    hx-target="this"
    hx-trigger="intersect once"
    hx-swap="outerHTML">
</div>
{{end}}
{{end}}
