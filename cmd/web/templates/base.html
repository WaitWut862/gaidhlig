{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gàidhlig Research</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app">
        <div id="search-panel">
            <div id="search-form">
                <select name="type"
                    hx-get="/search"
                    hx-target="#search-results"
                    hx-trigger="change"
                    hx-include="#search-form">
                    <option value="words">Words</option>
                    <option value="sentences">Sentences</option>
                    <option value="rules">Rules</option>
                </select>
                <input type="text" name="query"
                    autocomplete="off"
                    hx-get="/search"
                    hx-trigger="keyup delay:300ms, load"
                    hx-target="#search-results"
                    hx-include="#search-form"
                    placeholder="Search...">
                <div id="search-results"></div>
            </div>
        </div>
        <div id="view-panel">
            <p>Select an item from the search panel.</p>
        </div>
    </div>
</body>
</html>
{{end}}
