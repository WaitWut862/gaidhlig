{{define "results_sentences"}}
<div id="filters">
    <select name="exact"
        hx-get="/search"
        hx-target="#search-results"
        hx-trigger="change"
        hx-include="#search-form">
        <option value="false" {{if eq .Exact "false"}}selected{{end}}>Lemma match</option>
        <option value="true" {{if eq .Exact "true"}}selected{{end}}>Form match</option>
    </select>
</div>
{{range .Items}}
<div class="result-item"
    hx-get="/sentence/{{.ID}}"
    hx-target="#view-panel"
    hx-trigger="click"
    hx-swap="innerHTML">
    {{.TextGd}}
</div>
{{else}}
<p class="no-results">No sentences found.</p>
{{end}}
{{if and .Items (ne .NextOffset -1)}}
<div hx-get="/search?type=sentences&query={{.Query}}&exact={{.Exact}}&offset={{.NextOffset}}"
    hx-target="this"
    hx-trigger="intersect once"
    hx-swap="outerHTML">
</div>
{{end}}
{{end}}
