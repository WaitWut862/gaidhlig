{{define "items_rules"}}
{{range .Items}}
<div class="result-item"
    hx-get="/rule/{{.ID}}"
    hx-target="#view-panel"
    hx-trigger="click"
    hx-swap="innerHTML">
    {{.Title}}
    <span class="meta">{{.Category}} / {{.Difficulty}}</span>
</div>
{{end}}
{{if and .Items (ne .NextOffset -1)}}
<div hx-get="/search?type=rules&query={{.Query}}&category={{.Category}}&difficulty={{.Difficulty}}&offset={{.NextOffset}}"
    hx-target="this"
    hx-trigger="intersect once"
    hx-swap="outerHTML">
</div>
{{end}}
{{end}}
