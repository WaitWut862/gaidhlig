{{define "items_words"}}
{{range .Items}}
<div class="result-item"
    hx-get="/word/{{.ID}}"
    hx-target="#view-panel"
    hx-trigger="click"
    hx-swap="innerHTML">
    {{.Word}}
</div>
{{end}}
{{if and .Items (ne .NextOffset -1)}}
<div hx-get="/search?type=words&query={{.Query}}&pos={{.POS}}&offset={{.NextOffset}}"
    hx-target="this"
    hx-trigger="intersect once"
    hx-swap="outerHTML">
</div>
{{end}}
{{end}}
